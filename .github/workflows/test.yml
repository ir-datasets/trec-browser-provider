name: test

on:
  push: {branches: [main]}
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Lint
      # Pinned so a new ruff release cannot fail CI until its findings are
      # addressed -- bump the pin deliberately.
      run: |
        pip install ruff==0.17.6
        ruff check .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ir_datasets (git, for its v2 package)
      run: |
        python -m pip install --upgrade pip
        pip install 'git+https://github.com/ir-datasets/ir-datasets.git@v2'

    - name: Install this package
      run: |
        pip install -r requirements-test.txt
        pip install -e .

    - name: Install Java (PyTerrier, a test dependency, runs Terrier on a JVM)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Unit tests
      run: |
        pytest test/ --cov=trec_browser_provider --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        # Required: Codecov rejects tokenless uploads ("Token required - not
        # valid tokenless upload"). Add a repo-scoped upload token
        # (codecov.io -> trec-browser-provider -> Settings) as the
        # CODECOV_TOKEN repository secret.
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        # Uploads fail silently otherwise (step exits 0, badge stays
        # "unknown") -- make a rejected/failed upload loud instead.
        fail_ci_if_error: true
