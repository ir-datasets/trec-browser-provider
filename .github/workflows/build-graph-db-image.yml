name: build trec-browser graph-db image

# Manual only (a button click in the Actions UI, or `gh workflow run`) --
# this builds a deploy-ready image (bakes a freshly built graph.db in, see
# docker/graph-db.Dockerfile), not something every push/PR should trigger.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/graph-db.Dockerfile
        push: true
        tags: ghcr.io/ir-datasets/trec-browser-provider:0.0.1-trec-browser
